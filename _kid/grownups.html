<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grown-ups</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff8ea;--soft:#b9b3d6;--bg:#141a3a;--card:#1d2550;--line:rgba(255,255,255,.14);--gold:#ffc857}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;padding:24px 16px 60px}
main{max-width:860px;margin:0 auto}
h1{margin:0 0 4px;font-size:40px;color:var(--gold)}
p.sub{margin:0 0 24px;color:var(--soft);font-size:18px}
section{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:18px}
h2{margin:0 0 4px;font-size:26px}
.sum{color:var(--soft);font-size:17px;margin-bottom:10px}
.sum b{color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:17px}
th{text-align:left;color:var(--soft);font-weight:600;font-size:14px;padding:4px 6px}
td{padding:5px 6px;border-top:1px solid var(--line)}
td.n{text-align:right;width:56px}
.pips{display:flex;gap:3px}.pips i{width:14px;height:8px;border-radius:3px;background:rgba(255,255,255,.16)}.pips i.on{background:var(--gold)}
tr.new td{color:var(--soft)}
tr.weak td:first-child{color:#ff9aa8}
.gate{max-width:360px;margin:12vh auto;text-align:center}
.gate input{font:inherit;font-size:28px;width:120px;text-align:center;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:6px}
.gate button,.reset{font:inherit;font-weight:800;font-size:20px;border:0;border-radius:999px;padding:6px 26px;background:var(--gold);color:#2a1600;cursor:pointer;margin-left:8px}
.reset{background:#5b3a55;color:#fff;margin:0}
.hide{display:none}
</style>
</head>
<body>
<div id="gate" class="gate"><h1>Grown-ups</h1><p class="sub">Small sum to enter:</p><p style="font-size:34px;margin:0 0 12px" id="q"></p><input id="a" inputmode="numeric" autocomplete="off"><button id="go">Go</button></div>
<main id="main" class="hide">
  <h1>What is learned</h1>
  <p class="sub">Each item moves up a step when the child gets it right first time, and back to the start when they miss. Saved on this device only.</p>
  <div id="games"></div>
  <button class="reset" id="reset">Start over (clear everything)</button>
</main>
<script type="module">
import { VERBS } from '../hero-run/lines.js';
import { TOYS, RELS, PAIRS } from '../toy-room/lines.js';
import { GROUPS, KEY, WORDS } from '../alphabet-alley/lines.js';
import { PARTS, NUMS, COLORS } from '../monster-maker/lines.js';
import { FAMILIES } from '../rhyme-frog/lines.js';
import { ITEMS, WEATHER } from '../weather-wardrobe/lines.js';
import { FEELINGS } from '../feelings-friends/lines.js';

const $ = id => document.getElementById(id);
const a = 3 + Math.floor(Math.random() * 6), b = 4 + Math.floor(Math.random() * 5);
$('q').textContent = `${a} + ${b} = ?`;
const enter = () => { if (+$('a').value === a + b) { $('gate').classList.add('hide'); $('main').classList.remove('hide'); draw(); } else { $('a').value = ''; } };
$('go').onclick = enter; $('a').addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });

const read = k => { try { return JSON.parse(localStorage.getItem(k) || '{}'); } catch (e) { return {}; } };
const GAMES = [
  { id: 'hero', title: '🏃 Hero Run', what: 'action words', items: VERBS.map(v => ({ k: v.id, label: `${v.icon} ${v.word}` })) },
  { id: 'toy', title: '🧸 Toy Room', what: 'where things are',
    items: [...Object.entries(RELS).map(([id, w]) => ({ k: 'rel:' + id, label: `“${w}”` })), ...Object.keys(PAIRS).map(f => ({ k: 'furn:' + f, label: f })), ...TOYS.map(t => ({ k: 'toy:' + t.id, label: `${t.icon} ${t.id}` }))] },
  { id: 'alley', title: '🔤 Alphabet Alley', what: 'letter sounds and short words',
    items: [...GROUPS.flat().map(l => ({ k: 'snd:' + l, label: `${l}  (${KEY[l][1]} ${KEY[l][0]})` })), ...WORDS.map(w => ({ k: 'w:' + w.w, label: `word: ${w.w} ${w.e}` }))] },
  { id: 'monster', title: '👾 Monster Maker', what: 'body parts, counting to five, colors',
    items: [...Object.keys(PARTS).map(p => ({ k: 'part:' + p, label: PARTS[p].word })), ...NUMS.map((w, i) => ({ k: 'num:' + (i + 1), label: `${i + 1}  ${w}` })), ...Object.keys(COLORS).map(c => ({ k: 'color:' + c, label: c }))] },
  { id: 'rhyme', title: '🐸 Rhyme Frog', what: 'hearing which words rhyme',
    items: Object.entries(FAMILIES).map(([f, ws]) => ({ k: 'fam:' + f, label: `-${f}  (${ws.map(w => w[0]).join(', ')})` })) },
  { id: 'wear', title: '🧥 Weather Wardrobe', what: 'clothes, put on / take off, what to wear for the weather',
    items: [...Object.entries(ITEMS).map(([k, it]) => ({ k: 'it:' + k, label: `${it.e} ${it.word}` })), ...Object.entries(WEATHER).map(([w, d]) => ({ k: 'w:' + w, label: `${d.icon} dressing for ${w}` }))] },
  { id: 'feel', title: '💗 Feelings Friends', what: 'naming feelings from faces and from little stories',
    items: Object.entries(FEELINGS).map(([f, d]) => ({ k: 'f:' + f, label: `${d.e} ${f}` })) }
];
function draw() {
  const m = read('kid-mastery-v1'), pr = read('kid-progress-v1');
  $('games').innerHTML = GAMES.map(g => {
    const rows = g.items.map(it => ({ ...it, e: m[g.id + ':' + it.k] }));
    const met = rows.filter(r => r.e), known = met.filter(r => r.e.box >= 3), weak = met.filter(r => r.e.box <= 2 && r.e.wrong > 0);
    const p = pr[g.id === 'hero' ? 'hero' : g.id] || { stars: {} };
    const stars = Object.entries(p.stars || {}).map(([l, s]) => `level ${l} ${'★'.repeat(s)}`).join(' · ') || 'not played yet';
    return `<section><h2>${g.title}</h2><div class="sum">${g.what} · <b>${known.length}</b> known, <b>${met.length - known.length}</b> still learning, ${rows.length - met.length} not met yet<br>${stars}${weak.length ? `<br>Needs practice: <b>${weak.map(r => r.label).join(', ')}</b>` : ''}</div>
      <table><tr><th>Item</th><th class="n">Right</th><th class="n">Missed</th><th>Step</th></tr>${rows.map(r => `<tr class="${r.e ? (r.e.box <= 2 && r.e.wrong ? 'weak' : '') : 'new'}"><td>${r.label}</td><td class="n">${r.e ? r.e.right : '–'}</td><td class="n">${r.e ? r.e.wrong : '–'}</td><td><div class="pips">${[1, 2, 3, 4, 5].map(i => `<i class="${r.e && r.e.box >= i ? 'on' : ''}"></i>`).join('')}</div></td></tr>`).join('')}</table></section>`;
  }).join('');
}
$('reset').onclick = () => { if (confirm('Clear everything the games remember?')) { localStorage.removeItem('kid-mastery-v1'); localStorage.removeItem('kid-progress-v1'); localStorage.removeItem('monster-zoo-v1'); draw(); } };
</script>
</body>
</html>
