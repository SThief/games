<script type="module">
import * as THREE from 'three';
import * as kit from '../_kid/kit.js';
import { mat, geo, box, cyl, sph, cone, capsule, torus, prewarm } from '../_kid/shapes.js';
import { TOYS, RELS, PAIRS, LEVELS, key } from './lines.js';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const N_TASKS = 8;

/* ============ the room's geometry: one table of numbers drives BOTH the picture and the rules ============ */
const FURN = {
  bed:   { x0: -6.2, x1: -3.6, top: 1.5, under: 1.1, surf: 'bedTop' },
  table: { x0: -2.4, x1: -0.2, top: 1.8, under: 1.6, surf: 'tableTop' },
  chair: { x0: 0.9,  x1: 2.0,  top: 1.1, under: 0.9, surf: 'chairSeat' },
  box:   { x0: 3.3,  x1: 4.9,  wall: .15, height: 1.5, floorY: .15 }
};
const S_ = (x0, x1, y0, y1, noLift = false) => ({ x0, x1, y0, y1, noLift });
const SOLIDS = [
  S_(-6.2, -3.6, 1.1, 1.5), S_(-6.2, -5.95, 0, 2.4, true), S_(-6.2, -6.0, 0, 1.1, true), S_(-3.8, -3.6, 0, 1.1, true),         // bed
  S_(-2.4, -0.2, 1.6, 1.8), S_(-2.4, -2.2, 0, 1.6, true), S_(-0.4, -0.2, 0, 1.6, true),                                        // table
  S_(0.9, 2.0, 0.9, 1.1), S_(1.8, 2.0, 1.1, 2.3, true), S_(0.9, 1.05, 0, 0.9, true), S_(1.85, 2.0, 0, 0.9, true),              // chair
  S_(3.3, 3.45, 0, 1.5, true), S_(4.75, 4.9, 0, 1.5, true)                                                                     // box walls
];
const SURF = [
  { name: 'floor', x0: -7.1, x1: 7.1, y: 0 }, { name: 'bedTop', x0: -5.95, x1: -3.6, y: 1.5 }, { name: 'tableTop', x0: -2.4, x1: -0.2, y: 1.8 },
  { name: 'chairSeat', x0: 0.9, x1: 1.8, y: 1.1 }, { name: 'boxFloor', x0: 3.45, x1: 4.75, y: .15 }
];
const ZONES = [-3.0, 0.35, 2.65, 5.6];      // free bits of floor where toys start

// Where a toy ends up when let go at (x, bottom y): slides out of furniture, falls onto what is below it,
// then checks it is not stuck inside anything (a toy hanging off a seat edge would otherwise land in a leg).
const clips = (x, y, r, h, s) => x + r > s.x0 + .001 && x - r < s.x1 - .001 && y + h > s.y0 + .001 && y < s.y1 - .001;
function settle(x, yb, r, h) {
  x = clamp(x, -7 + r, 7 - r); let y0 = Math.max(0, yb);
  const B = FURN.box;
  if (x >= B.x0 && x <= B.x1) x = clamp(x, B.x0 + B.wall + r, B.x1 - B.wall - r);          // over the box: it goes in
  let y = 0, sup = 'floor';
  for (let round = 0; round < 8; round++) {
    for (let it = 0; it < 6; it++) {
      let moved = false;
      for (const s of SOLIDS) {
        if (clips(x, y0, r, h, s)) {
          if (!s.noLift && y0 >= s.y1 - .45) y0 = s.y1;                                      // just below a top: sits on it
          else x = Math.abs(x - (s.x0 - r)) < Math.abs(x - (s.x1 + r)) ? s.x0 - r : s.x1 + r; // else slide out sideways
          moved = true;
        }
      }
      if (!moved) break;
    }
    x = clamp(x, -7 + r, 7 - r);
    let best = SURF[0];
    for (const s of SURF) if (x >= s.x0 && x <= s.x1 && s.y <= y0 + .02 && s.y >= best.y) best = s;
    y = best.y; sup = best.name;
    const stuck = SOLIDS.find(s => clips(x, y, r, h, s));
    if (!stuck) return { x, y, support: sup, r, h };
    x = Math.abs(x - (stuck.x0 - r)) < Math.abs(x - (stuck.x1 + r)) ? stuck.x0 - r : stuck.x1 + r;
  }
  x = ZONES.reduce((a, z) => Math.abs(z - x) < Math.abs(a - x) ? z : a, ZONES[0]);         // last resort: the nearest free spot
  return { x, y: 0, support: 'floor', r, h };
}
// Every true statement about where a resting toy is.
function relations(st) {
  const out = [];
  for (const [f, F] of Object.entries(FURN)) {
    if (F.surf && st.support === F.surf) out.push(['on', f]);
    if (f === 'box' && st.support === 'boxFloor') out.push(['in', f]);
    const inside = st.x >= F.x0 && st.x <= F.x1;
    if (F.under != null && st.support === 'floor' && inside && st.y + st.h <= F.under + .02) out.push(['under', f]);
    if (st.support === 'floor' && !inside) { const gap = Math.max(F.x0 - (st.x + st.r), (st.x - st.r) - F.x1); if (gap <= 1.25) out.push(['next', f, gap]); }
  }
  return out.filter(([r, f]) => PAIRS[f].includes(r));
}
const holds = (st, rel, furn) => relations(st).some(([r, f]) => r === rel && f === furn);
function describe(st) {
  const rs = relations(st); if (!rs.length) return { rel: 'floor', furn: null };
  const order = { in: 0, on: 1, under: 2, next: 3 };
  rs.sort((a, b) => order[a[0]] - order[b[0]] || (a[2] || 0) - (b[2] || 0));
  return { rel: rs[0][0], furn: rs[0][1] };
}
// The spot where letting go of a toy makes the sentence true (used for the ghost hint, and by the tests).
function targetPoint(toyId, rel, furn) {
  const T = TOYD[toyId], F = FURN[furn], mk = (x, yb) => ({ x, yb, y: yb + T.h / 2 });
  if (rel === 'on') return mk((F.x0 + F.x1) / 2 + (furn === 'bed' ? .15 : 0), F.top + .5);
  if (rel === 'in') return mk((F.x0 + F.x1) / 2, 2.6);
  if (rel === 'under') return mk((F.x0 + F.x1) / 2 + (furn === 'bed' ? .1 : 0), 0);
  let best = null;                                                                           // next to: nearest floor spot that works
  for (let x = -6.9; x <= 6.9; x += .05) { const st = settle(x, 0, T.r, T.h); if (st.support === 'floor' && Math.abs(st.x - x) < .001 && holds(st, 'next', furn)) { const d = Math.abs(x - (F.x0 + F.x1) / 2); if (!best || d < best.d) best = { d, x }; } }
  return best ? mk(best.x, 0) : null;
}

/* ============ the toys (built from simple shapes; origin = middle of the bottom) ============ */
const TOYD = {
  cat: { r: .5, h: .95, build() {
    const g = new THREE.Group(), c = 0xff9a4d, body = sph(1, c); body.scale.set(.5, .4, .42); body.position.y = .4; g.add(body);
    g.add(sph(.3, c, 0, .78, .1)); for (const s of [-1, 1]) { const e = cone(.11, .24, c, s * .17, 1.06, .08); e.rotation.z = -s * .25; g.add(e, cone(.06, .14, 0xffb3c6, s * .17, 1.04, .14).rotateZ(-s * .25)); g.add(sph(.075, 0xffffff, s * .11, .82, .36), sph(.04, 0x222222, s * .11, .82, .42)); }
    g.add(sph(.05, 0xff6b8a, 0, .74, .4)); const tail = cyl(.06, .05, .55, c, -.5, .55, -.05); tail.rotation.z = .9; g.add(tail);
    for (const s of [-1, 1]) g.add(sph(.11, c, s * .22, .1, .25)); return g; } },
  ball: { r: .42, h: .84, build() {
    const cv = document.createElement('canvas'); cv.width = 128; cv.height = 64; const x = cv.getContext('2d');
    for (let i = 0; i < 8; i++) { x.fillStyle = i % 2 ? '#ffffff' : '#ff4d6d'; x.fillRect(i * 16, 0, 16, 64); }
    const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
    const g = new THREE.Group(), m = new THREE.Mesh(geo('ballS', () => new THREE.SphereGeometry(.42, 24, 16)), new THREE.MeshStandardMaterial({ map: t, roughness: .4 })); m.position.y = .42; g.add(m); return g; } },
  teddy: { r: .5, h: 1.0, build() {
    const g = new THREE.Group(), c = 0xb07a45; g.add(sph(.4, c, 0, .42, 0), sph(.32, c, 0, .92 - .1, .05)); for (const s of [-1, 1]) g.add(sph(.12, c, s * .24, 1.1, 0), sph(.06, 0xf2c99b, s * .24, 1.1, .08), sph(.13, c, s * .42, .55, .1), sph(.15, c, s * .22, .1, .12), sph(.06, 0x222222, s * .12, .86, .33));
    g.add(sph(.13, 0xf2c99b, 0, .78, .3), sph(.05, 0x3a2a2a, 0, .82, .42), sph(.2, 0xf2c99b, 0, .42, .32)); g.scale.setScalar(.95); return g; } },
  duck: { r: .48, h: .9, build() {
    const g = new THREE.Group(), y = 0xffd23f, b = sph(1, y); b.scale.set(.5, .38, .42); b.position.y = .38; g.add(b, sph(.27, y, .22, .8, 0));
    const bk = box(.28, .09, .2, 0xff8a3d, .5, .77, 0); g.add(bk, sph(.05, 0x222222, .38, .9, .15), sph(.05, 0x222222, .38, .9, -.15));
    const w = sph(1, 0xf2b800); w.scale.set(.25, .17, .3); w.position.set(-.05, .42, .38); g.add(w); const t = cone(.15, .3, y, -.5, .55, 0); t.rotation.z = .9; g.add(t); return g; } },
  cup: { r: .36, h: .7, build() {
    const g = new THREE.Group(); g.add(cyl(.32, .27, .6, 0xffffff, 0, .35, 0), cyl(.335, .335, .12, 0x4dd2ff, 0, .4, 0), cyl(.3, .3, .02, 0x6b3a1f, 0, .64, 0)); const h = torus(.17, .05, 0xffffff, Math.PI * 1.3); h.position.set(.36, .36, 0); h.rotation.z = -Math.PI * .65; g.add(h); return g; } },
  book: { r: .55, h: .28, build() {
    const g = new THREE.Group(); g.add(box(1.05, .26, .78, 0xe63946, 0, .14, 0), box(.98, .2, .72, 0xfff6e0, .03, .14, .02), box(1.06, .27, .08, 0xb51f2c, -.0, .14, -.36)); g.add(box(.5, .02, .3, 0xffd23f, 0, .272, .02)); return g; } },
  hat: { r: .42, h: .8, build() {
    const g = new THREE.Group(); g.add(cyl(.42, .42, .06, 0x2a2a3c, 0, .03, 0), cyl(.27, .27, .7, 0x2a2a3c, 0, .4, 0), cyl(.285, .285, .14, 0xff4d6d, 0, .2, 0)); return g; } },
  apple: { r: .38, h: .8, build() {
    const g = new THREE.Group(), a = sph(.38, 0xe63946, 0, .4, 0); a.scale.set(1, .92, 1); g.add(a, cyl(.03, .03, .2, 0x6b3a1f, 0, .82, 0, 6)); const l = sph(.1, 0x4fbf5a, .12, .82, 0); l.scale.set(1.6, .4, 1); g.add(l); return g; } }
};

/* ============ scene ============ */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
let dpr = Math.min(+new URLSearchParams(location.search).get('dpr') || devicePixelRatio || 1, 1.5); renderer.setPixelRatio(dpr);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xffd9a8);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9b48a, 1.25));
const sun = new THREE.DirectionalLight(0xffefd0, 1.5); sun.position.set(-4, 9, 9); scene.add(sun);
const camera = new THREE.PerspectiveCamera(32, 1, .1, 80);
function fit() {
  const w = innerWidth || 1280, h = innerHeight || 720, aspect = w / h, t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  renderer.setSize(w, h, false); camera.aspect = aspect; camera.updateProjectionMatrix();
  const dist = Math.max(7.3 / (t * aspect), 3.7 / t) + 1;
  camera.position.set(.9, 3.4 + (aspect < 1 ? 1 : 0), dist); camera.lookAt(0, 2.45, 0);
}
addEventListener('resize', fit); fit();

(function room() {
  const wall = 0xffe6c2, floor = 0xe8b878;
  const fc = document.createElement('canvas'); fc.width = 256; fc.height = 64; const x = fc.getContext('2d');
  for (let i = 0; i < 8; i++) { x.fillStyle = i % 2 ? '#e8b878' : '#e0ac6c'; x.fillRect(i * 32, 0, 32, 64); x.fillStyle = 'rgba(120,70,20,.25)'; x.fillRect(i * 32, 0, 2, 64); }
  const ft = new THREE.CanvasTexture(fc); ft.colorSpace = THREE.SRGBColorSpace; ft.wrapS = ft.wrapT = THREE.RepeatWrapping; ft.repeat.set(1, 6);
  const fl = new THREE.Mesh(geo('floorG', () => new THREE.BoxGeometry(15, .4, 14)), new THREE.MeshStandardMaterial({ map: ft, roughness: .8 })); fl.position.set(0, -.2, 3.9); scene.add(fl);
  scene.add(box(15, 9, .3, wall, 0, 4.5, -3.1), box(15, 1.1, .4, 0xf3c48a, 0, .55, -2.95));
  scene.add(box(.4, 9, 6.4, 0xffd6a0, -7.4, 4.5, 0), box(.4, 9, 6.4, 0xffd6a0, 7.4, 4.5, 0));
  // window
  scene.add(box(2.6, 2.4, .15, 0xffffff, 1.2, 4.7, -2.9), box(2.3, 2.1, .2, 0x9fe0ff, 1.2, 4.7, -2.85), box(.1, 2.1, .22, 0xffffff, 1.2, 4.7, -2.83), box(2.3, .1, .22, 0xffffff, 1.2, 4.7, -2.83), sph(.35, 0xfff3a0, 1.75, 5.1, -2.75));
  // pictures + rug
  scene.add(box(1.2, 1.5, .1, 0xb57c3f, -4.6, 4.9, -2.9), box(1.0, 1.3, .12, 0xff8fb0, -4.6, 4.9, -2.85), sph(.3, 0xffd23f, -4.6, 5.0, -2.75), box(1.1, .9, .1, 0xb57c3f, -1.9, 5.1, -2.9), box(.9, .7, .12, 0x7fd6a0, -1.9, 5.1, -2.85));
  const rug = cyl(2.4, 2.4, .04, 0xc58cff, 0, .02, .8, 32); rug.scale.set(1.4, 1, .55); scene.add(rug);
  const rug2 = cyl(1.6, 1.6, .05, 0xf3d9ff, 0, .03, .8, 32); rug2.scale.set(1.4, 1, .55); scene.add(rug2);
})();
const furnG = {};
(function furniture() {
  const bed = new THREE.Group();
  bed.add(box(2.6, .2, 2.0, 0x8b5a2b, -4.9, 1.0, 0), box(2.6, .34, 1.9, 0xffffff, -4.9, 1.29, 0), box(1.8, .1, 1.95, 0x5db1ff, -4.6, 1.5, 0), box(.25, 2.4, 2.0, 0x8b5a2b, -6.075, 1.2, 0), sph(.36, 0xffffff, -5.5, 1.62, 0));
  bed.children[bed.children.length - 1].scale.set(1, .5, 2.2);
  for (const [x, z] of [[-6.1, .85], [-6.1, -.85], [-3.7, .85], [-3.7, -.85]]) bed.add(box(.2, 1.0, .2, 0x8b5a2b, x, .5, z));
  const table = new THREE.Group(); table.add(box(2.2, .2, 2.0, 0xc98b4e, -1.3, 1.7, 0));
  for (const [x, z] of [[-2.3, .8], [-2.3, -.8], [-.3, .8], [-.3, -.8]]) table.add(box(.2, 1.6, .2, 0xa9703a, x, .8, z));
  table.add(cyl(.22, .22, .3, 0x7fd6a0, -1.3, 1.95, 0), sph(.16, 0xff6b8a, -1.3, 2.2, 0)); table.children.slice(-2).forEach(m => { m.userData.deco = 1; });
  const chair = new THREE.Group(); chair.add(box(1.1, .2, 1.1, 0x4dd2ff, 1.45, 1.0, 0), box(.2, 1.2, 1.1, 0x2a9fd6, 1.9, 1.7, 0));
  for (const [x, z] of [[.98, .45], [.98, -.45], [1.92, .45], [1.92, -.45]]) chair.add(box(.15, .9, .15, 0x2a9fd6, x, .45, z));
  const bx = new THREE.Group(); bx.add(box(1.6, .15, 1.4, 0xd9a066, 4.1, .075, 0), box(.15, 1.5, 1.4, 0xd9a066, 3.375, .75, 0), box(.15, 1.5, 1.4, 0xd9a066, 4.825, .75, 0), box(1.6, 1.5, .12, 0xc98b4e, 4.1, .75, -.65), box(.3, 1.5, .02, 0xffd23f, 4.1, .75, -.58));
  bx.add(box(.75, .1, .55, 0xe6b070, 3.75, 1.55, -.3).rotateZ(.5), box(.75, .1, .55, 0xe6b070, 4.45, 1.55, -.3).rotateZ(-.5));
  Object.assign(furnG, { bed, table, chair, box: bx }); for (const g of Object.values(furnG)) scene.add(g);
})();

/* ============ toys in play ============ */
const hitMat = new THREE.MeshBasicMaterial({ visible: false });
const toys = {};               // id -> toy
function makeToy(id) {
  const T = TOYD[id], g = new THREE.Group(); g.add(T.build());
  const hit = new THREE.Mesh(new THREE.SphereGeometry(Math.max(T.r, T.h / 2) + .35, 8, 6), hitMat); hit.position.y = T.h / 2; hit.userData.toy = id; g.add(hit);
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(T.r * 1.1, 16), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: .2 })); shadow.rotation.x = -Math.PI / 2; g.userData.shadow = shadow; scene.add(shadow);
  scene.add(g); g.visible = false; shadow.visible = false;
  return { id, g, shadow, r: T.r, h: T.h, x: 0, y: 0, z: 0, support: 'floor', vy: 0, state: 'rest', anim: 0, wob: 0, zoff: rnd(-.3, .3), hit };
}
for (const t of TOYS) toys[t.id] = makeToy(t.id);
const parts = []; for (let i = 0; i < 40; i++) { const m = new THREE.Mesh(geo('oct', () => new THREE.OctahedronGeometry(.1)), new THREE.MeshBasicMaterial({ color: 0xffe14d })); m.visible = false; scene.add(m); parts.push({ m, life: 0, v: new THREE.Vector3() }); }
function burst(x, y, n = 14, color = 0xffe14d) { let k = 0; for (const p of parts) { if (p.life > 0) continue; p.m.material.color.setHex(color); p.m.position.set(x, y, .8); p.v.set(rnd(-3, 3), rnd(2, 5), rnd(-1, 1)); p.life = .9; p.m.visible = true; if (++k >= n) break; } }
const ring = new THREE.Mesh(new THREE.RingGeometry(.55, .68, 32), new THREE.MeshBasicMaterial({ color: 0xffc857, side: THREE.DoubleSide })); ring.visible = false; scene.add(ring);

/* ============ game state ============ */
const S = { mode: 'menu', level: 0, results: [], task: null, held: null, busy: false, instant: false, idle: 0, demo: null, t: 0, active: [] };
const tt = toy => TOYS.find(t => t.id === toy);

function startSession(level) {
  Object.assign(S, { mode: 'play', level, results: [], busy: false, held: null });
  $('menu').classList.add('hide'); $('end').classList.add('hide'); $('prompt').classList.remove('hide');
  $('dots').innerHTML = '<i></i>'.repeat(N_TASKS);
  newTask();
}
function newTask() {
  const rels = LEVELS[S.level], last = S.task;
  const rel = kit.mastery.pick('toy', rels.map(r => 'rel:' + r), last && 'rel:' + last.rel).slice(4);
  const furn = kit.mastery.pick('toy', Object.keys(PAIRS).filter(f => PAIRS[f].includes(rel)).map(f => 'furn:' + f), last && 'furn:' + last.furn).slice(5);
  const toy = kit.mastery.pick('toy', TOYS.map(t => 'toy:' + t.id), last && 'toy:' + last.toy).slice(4);
  S.task = { toy, rel, furn, miss: { rel: false, furn: false, toy: false }, attempts: 0, done: false, hinted: false, firstSeen: kit.mastery.get('toy', 'rel:' + rel).box === 0 };
  // start positions: the target toy away from where the sentence would already be true
  const others = TOYS.map(t => t.id).filter(i => i !== toy).sort(() => Math.random() - .5).slice(0, 2);
  S.active = [toy, ...others];
  const zones = ZONES.slice().sort(() => Math.random() - .5);
  const okZone = z => { const st = settle(z, 0, TOYD[toy].r, TOYD[toy].h); return !holds(st, rel, furn); };
  const zt = zones.find(okZone) ?? zones[0]; zones.splice(zones.indexOf(zt), 1);
  const spots = [zt, zones[0], zones[1]];
  for (const t of Object.values(toys)) { t.g.visible = false; t.shadow.visible = false; }
  S.active.forEach((id, i) => { const t = toys[id], st = settle(spots[i], 0, t.r, t.h); Object.assign(t, { x: st.x, y: st.y, support: st.support, state: 'rest', vy: 0, anim: 0, wob: 0, pop: .01 }); t.g.visible = true; t.shadow.visible = true; });
  kit.preload(['yes', 'done', key.task(toy, rel, furn), ...S.active.flatMap(i => [key.toy(i), key.that(i)]), key.furn(furn), key.is(toy, 'floor'), ...Object.entries(PAIRS).flatMap(([f, rs]) => rs.map(r => key.is(toy, r, f)))]);
  showPrompt(); S.busy = false; S.idle = 0; S.demo = null; ring.visible = false; $('hand').classList.add('hide');
  setTimeout(() => sayTask(), quiet ? 0 : 700);
  if (S.task.firstSeen) S.demoTimer = 3.2; else S.demoTimer = null;
}
const sayTask = () => kit.say(key.task(S.task.toy, S.task.rel, S.task.furn));
const svg = inner => `<svg viewBox="0 0 64 64">${inner}</svg>`;
const GL = {
  rel: {
    on: svg('<rect x="6" y="38" width="52" height="11" rx="3" fill="#8b7fc7"/><circle cx="32" cy="26" r="11" fill="#ff8a3d"/>'),
    in: svg('<path d="M10 20 V52 H54 V20" fill="none" stroke="#8b7fc7" stroke-width="7" stroke-linejoin="round"/><circle cx="32" cy="38" r="10" fill="#ff8a3d"/>'),
    under: svg('<rect x="6" y="12" width="52" height="9" rx="3" fill="#8b7fc7"/><rect x="10" y="21" width="5" height="32" fill="#8b7fc7"/><rect x="49" y="21" width="5" height="32" fill="#8b7fc7"/><circle cx="32" cy="41" r="10" fill="#ff8a3d"/>'),
    next: svg('<rect x="4" y="18" width="26" height="34" rx="4" fill="#8b7fc7"/><circle cx="46" cy="41" r="11" fill="#ff8a3d"/>')
  },
  furn: {
    bed: svg('<rect x="6" y="36" width="52" height="11" rx="4" fill="#5db1ff"/><rect x="6" y="22" width="8" height="34" rx="2" fill="#8b5a2b"/><rect x="16" y="30" width="16" height="7" rx="3" fill="#fff"/><rect x="50" y="47" width="5" height="9" fill="#8b5a2b"/>'),
    table: svg('<rect x="6" y="20" width="52" height="9" rx="3" fill="#c98b4e"/><rect x="10" y="29" width="6" height="28" fill="#a9703a"/><rect x="48" y="29" width="6" height="28" fill="#a9703a"/>'),
    chair: svg('<rect x="14" y="8" width="8" height="34" rx="2" fill="#2a9fd6"/><rect x="14" y="34" width="32" height="8" rx="2" fill="#4dd2ff"/><rect x="16" y="42" width="5" height="16" fill="#2a9fd6"/><rect x="40" y="42" width="5" height="16" fill="#2a9fd6"/>'),
    box: svg('<rect x="8" y="24" width="48" height="32" rx="3" fill="#d9a066"/><rect x="8" y="18" width="48" height="9" rx="2" fill="#b57c3f"/><rect x="28" y="24" width="8" height="32" fill="#ffd23f"/>')
  }
};
function showPrompt() {
  const { toy, rel, furn } = S.task;
  $('prompt').innerHTML = `<div class="cell" data-say="toy"><div class="pic">${tt(toy).icon}</div><b>${toy}</b></div><div class="sep"></div><div class="cell" data-say="task"><div class="pic">${GL.rel[rel]}</div><b>${RELS[rel]}</b></div><div class="sep"></div><div class="cell" data-say="furn"><div class="pic">${GL.furn[furn]}</div><b>${furn}</b></div>`;
  $('prompt').querySelectorAll('.cell').forEach(c => c.addEventListener('pointerdown', e => { e.stopPropagation(); const w = c.dataset.say; if (w === 'toy') kit.say(key.toy(toy)); else if (w === 'furn') kit.say(key.furn(furn)); else sayTask(); }));
  const done = S.results.length; [...$('dots').children].forEach((d, i) => { d.className = i < done ? (S.results[i] ? 'ok' : 'no') : ''; });
}

/* ---------- picking up and dropping ---------- */
const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), v3 = new THREE.Vector3();
function pointerWorld(e) {
  const r = canvas.getBoundingClientRect(), nx = ((e.clientX - r.left) / r.width) * 2 - 1, ny = -((e.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera({ x: nx, y: ny }, camera); return { hit: ray.ray.intersectPlane(plane, v3) ? v3.clone() : null, ray };
}
canvas.addEventListener('pointerdown', e => {
  kit.audio(); if (S.mode !== 'play' || S.busy) return;
  S.idle = 0; cancelDemo();
  const { hit, ray: rc } = pointerWorld(e);
  const cand = S.active.map(id => toys[id].hit), hits = rc.intersectObjects(cand, false);
  if (hits.length) {
    const t = toys[hits[0].object.userData.toy]; S.held = t; t.state = 'held'; t.moved = 0; t.grab = { x: hit ? hit.x - t.x : 0, y: hit ? hit.y - (t.y + t.h / 2) : 0 };
    canvas.setPointerCapture(e.pointerId); kit.sfx.pop();
    if (t.id === S.task.toy) kit.say(key.toy(t.id));
    else { if (!S.task.miss.toy) S.task.miss.toy = true; kit.sayChain([key.that(t.id), key.task(S.task.toy, S.task.rel, S.task.furn)], 80); }
    return;
  }
  if (hit) {                                     // tapped the room: say what furniture it is
    for (const [f, F] of Object.entries(FURN)) if (hit.x >= F.x0 && hit.x <= F.x1 && hit.y <= (F.top || F.height) + .3) { kit.say(key.furn(f)); kit.sfx.pop(); furnG[f].userData.squash = .25; return; }
  }
});
canvas.addEventListener('pointermove', e => {
  const t = S.held; if (!t) return; S.idle = 0;
  const { hit } = pointerWorld(e); if (!hit) return;
  t.tx = clamp(hit.x - t.grab.x, -6.9, 6.9); t.ty = clamp(hit.y - t.grab.y - t.h / 2, 0, 5.2); t.moved += 1;
});
const release = e => { const t = S.held; if (!t) return; S.held = null; dropToy(t, t.tx ?? t.x, t.ty ?? t.y); };
canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release);

function dropToy(t, x, yb) {
  const st = settle(x, yb, t.r, t.h);
  t.rest = st; t.state = 'fall'; t.vy = 0;
  if (S.instant) { land(t); }
}
function land(t) {
  const st = t.rest; t.x = st.x; t.y = st.y; t.support = st.support; t.state = 'rest'; t.vy = 0; t.tx = t.ty = undefined; kit.sfx.thud();
  furnFor(st.support) && (furnFor(st.support).userData.squash = .12);
  evaluate(t);
}
const furnFor = s => ({ bedTop: furnG.bed, tableTop: furnG.table, chairSeat: furnG.chair, boxFloor: furnG.box }[s]);
const stateOf = t => ({ x: t.x, y: t.y, h: t.h, r: t.r, support: t.support });

function evaluate(t) {
  const K = S.task; if (!K || K.done || S.busy || t.id !== K.toy) return;
  K.attempts++;
  const st = stateOf(t);
  if (holds(st, K.rel, K.furn)) return success(t);
  const d = describe(st);
  if (!K.miss.rel && !K.miss.furn) {                                         // first miss: work out which word it was
    if (d.furn === K.furn) K.miss.rel = true; else if (d.rel === K.rel) K.miss.furn = true; else { K.miss.rel = true; K.miss.furn = true; }
  }
  t.wob = .5; kit.sfx.boing();
  kit.sayChain([d.rel === 'floor' ? key.is(t.id, 'floor') : key.is(t.id, d.rel, d.furn), key.task(K.toy, K.rel, K.furn)], 150);
  if (K.attempts >= 2) showHint();
}
function success(t) {
  const K = S.task; K.done = true; S.busy = true;
  const first = !(K.miss.rel || K.miss.furn || K.miss.toy);
  kit.mastery.record('toy', 'rel:' + K.rel, !K.miss.rel); kit.mastery.record('toy', 'furn:' + K.furn, !K.miss.furn); kit.mastery.record('toy', 'toy:' + K.toy, !K.miss.toy);
  S.results.push(first); const d = $('dots').children[S.results.length - 1]; if (d) d.className = first ? 'ok' : 'no';
  t.anim = 1.2; kit.sfx.cheer(); burst(t.x, t.y + t.h + .3, 18); const F = furnFor(t.support) || furnG[K.furn]; if (F) F.userData.squash = .35;
  ring.visible = false; cancelDemo();
  kit.sayChain(['yes', key.is(K.toy, K.rel, K.furn)], 100);
  setTimeout(() => { if (S.results.length >= N_TASKS) endSession(); else newTask(); }, quiet ? 0 : 3000);
}
function endSession() {
  S.mode = 'end'; const n = S.results.filter(Boolean).length, stars = n >= 7 ? 3 : n >= 5 ? 2 : 1, unlock = n >= 5;
  kit.progress.finish('toy', S.level + 1, stars, unlock); kit.sfx.big(); kit.confetti(70); kit.say('done');
  $('stars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars); $('score').textContent = n + ' / ' + N_TASKS;
  $('nextlv').classList.toggle('hide', !(unlock && S.level < 2)); $('prompt').classList.add('hide'); $('end').classList.remove('hide'); S.endResult = { n, stars };
}

/* ---------- hint: a glowing ring where it goes, and a hand showing the move ---------- */
function showHint() {
  const K = S.task; if (K.hinted || K.done) return; K.hinted = true;
  const p = targetPoint(K.toy, K.rel, K.furn); if (!p) return;
  ring.position.set(p.x, p.y, .3); ring.visible = true; ring.scale.setScalar(TOYD[K.toy].r * 1.6 + .3);
  const t = toys[K.toy]; S.demo = { t: 0, from: new THREE.Vector3(t.x, t.y + t.h / 2, .5), to: new THREE.Vector3(p.x, p.y, .5) }; $('hand').classList.remove('hide');
}
function cancelDemo() { S.demo = null; $('hand').classList.add('hide'); }
function project(v) { const p = v.clone().project(camera); return { x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight }; }

/* ---------- screens ---------- */
function buildMenu() {
  const p = kit.progress.get('toy');
  $('doors').innerHTML = LEVELS.map((rels, i) => { const lock = i + 1 > p.unlocked, st = p.stars[i + 1] || 0;
    return `<button class="kdoor ${lock ? 'lock' : ''}" data-l="${i}"><div class="rels">${rels.map(r => GL.rel[r]).join('')}</div><div class="st">${lock ? '🔒' : '★'.repeat(st) + '☆'.repeat(3 - st)}</div></button>`; }).join('');
  $('doors').querySelectorAll('.kdoor:not(.lock)').forEach(b => b.addEventListener('click', () => { kit.audio(); startSession(+b.dataset.l); }));
}
function toMenu() { kit.stopSpeech(); S.mode = 'menu'; S.task = null; S.held = null; for (const t of Object.values(toys)) { t.g.visible = false; t.shadow.visible = false; } ring.visible = false; cancelDemo(); $('prompt').classList.add('hide'); $('end').classList.add('hide'); $('dots').innerHTML = ''; buildMenu(); $('menu').classList.remove('hide'); }
$('home').onclick = toMenu; $('speak').onclick = () => { if (S.task) sayTask(); };
$('again').onclick = () => startSession(S.level); $('nextlv').onclick = () => startSession(Math.min(2, S.level + 1));
$('mute').onclick = () => { kit.setMuted(!kit.isMuted()); $('mute').textContent = kit.isMuted() ? '🔇' : '🔊'; kit.audio(); };
$('mute').textContent = '🔊';

/* ---------- loop ---------- */
let quiet = false, frozen = false, dirty = true;
function update(dt) {
  S.t += dt;
  for (const t of S.active.map(i => toys[i])) {
    if (t.state === 'held') { const k = 1 - Math.exp(-26 * dt), tx = t.tx ?? t.x, ty = t.ty ?? t.y; t.g.rotation.z += ((clamp((tx - t.x) * -.5, -.5, .5)) - t.g.rotation.z) * .3; t.x += (tx - t.x) * k; t.y += (ty - t.y) * k; t.z += (.9 - t.z) * .2; }

      t.z += (t.zoff - t.z) * .25; t.g.rotation.z *= .8;

    }

    t.g.position.set(t.x, t.y + oy + (t.state === 'held' ? .1 : 0), t.z); t.g.rotation.y = ry; t.g.scale.setScalar(sc);
    const sup = t.state === 'held' || t.state === 'fall' ? (t.rest ? t.rest.y : 0) : t.y; t.shadow.position.set(t.x, (t.state === 'held' ? settle(t.x, t.y, t.r, t.h).y : sup) + .02, t.z); t.shadow.scale.setScalar(t.state === 'held' ? .8 : 1);
  }
  for (const g of Object.values(furnG)) { if (g.userData.squash > 0) { g.userData.squash = Math.max(0, g.userData.squash - dt * .9); g.scale.y = 1 - Math.sin(g.userData.squash * 12) * g.userData.squash * .25; } else g.scale.y = 1; }
  for (const p of parts) if (p.life > 0) { p.life -= dt; p.m.position.addScaledVector(p.v, dt); p.v.y -= 9 * dt; if (p.life <= 0) p.m.visible = false; }
  if (ring.visible && S.task) { ring.rotation.z += dt; ring.scale.setScalar((TOYD[S.task.toy].r * 1.6 + .3) * (1 + Math.sin(S.t * 6) * .06)); }
  if (S.mode === 'play' && !S.busy && S.task) {

    const k = T < .5 ? 0 : T < 2.1 ? (T - .5) / 1.6 : 1, e = k * k * (3 - 2 * k), x = a.x + (b.x - a.x) * e, y = a.y + (b.y - a.y) * e, press = T > .3 && T < 2.4 ? 1 : 0;
    $('hand').style.transform = `translate(${x - 18}px,${y - 6 + (press ? 8 : 0)}px) scale(${press ? .9 : 1.05})`;
    if (d.t > 10.2) cancelDemo();
  }
}
let last = performance.now(), slow = 0;
function frame(now) {
  requestAnimationFrame(frame); const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!frozen) update(dt); if (!frozen || dirty) { renderer.render(scene, camera); dirty = false; }
  if (dt > .026 && dpr > 1) { if (++slow > 40) { dpr = 1; renderer.setPixelRatio(1); slow = 0; } } else slow = Math.max(0, slow - 1);
}
await kit.loadVoice(); buildMenu(); prewarm(renderer, scene, camera); requestAnimationFrame(frame);

window.toyroom = {
  S, FURN, TOYD, toys, kit, settle, relations, holds, describe, targetPoint, startSession, newTask, update, toMenu,
  quiet(v) { quiet = v; kit.setQuiet(v); S.instant = v; }, freeze(v) { frozen = v; dirty = true; }, draw() { dirty = true; },
  info() { const i = renderer.info; return { drawCalls: i.render.calls, triangles: i.render.triangles, geometries: i.memory.geometries, textures: i.memory.textures, pixelRatio: renderer.getPixelRatio(), canvas: renderer.domElement.width + 'x' + renderer.domElement.height }; },
  drop(id, x, yCenter) { const t = toys[id]; dropToy(t, x, yCenter - t.h / 2); if (!S.instant) { let n = 0; while (t.state === 'fall' && n++ < 600) update(1 / 60); } return stateOf(t); }
};
