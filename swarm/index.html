<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Swarm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0d18'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffc857'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff7ea;--soft:#aab0cc;--gold:#ffc857;--bg:#0a0d18;--line:rgba(255,240,210,.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:"Baloo 2",system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:rgba(6,8,18,.66);padding:16px}
.hide{display:none!important}
h1{margin:0;font-size:clamp(60px,15vw,128px);letter-spacing:.1em;line-height:.9;color:var(--gold);text-shadow:0 0 44px rgba(255,200,87,.4)}
h2{margin:0;font-size:clamp(34px,7vw,56px);color:var(--gold)}
.sub{color:var(--soft);font-size:20px}
.big{font:inherit;font-weight:800;font-size:26px;padding:6px 40px;border-radius:999px;border:0;color:#1a1200;background:var(--gold);cursor:pointer;box-shadow:0 6px 0 #b98a1e,0 12px 30px rgba(255,200,87,.25)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #b98a1e}
.keys{display:flex;gap:22px;color:var(--soft);font-size:18px;flex-wrap:wrap;justify-content:center}
.keys b{color:var(--ink)}
#cards{flex-direction:column}
#cards .row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.card{width:190px;background:linear-gradient(#1c2340,#12172c);border:2px solid var(--line);border-radius:20px;padding:16px 12px 14px;cursor:pointer;transition:transform .12s,border-color .12s;font:inherit;color:inherit}
.card:hover{transform:translateY(-6px);border-color:var(--gold)}
.card .ic{font-size:46px;line-height:1.1}
.card .nm{font-weight:800;font-size:22px;margin-top:4px}
.card .tg{display:inline-block;margin-top:2px;font-size:13px;font-weight:800;color:#1a1200;background:var(--gold);border-radius:999px;padding:0 10px}
.card .tg.up{background:#8ad0ff}
.card .ds{color:var(--soft);font-size:16px;margin-top:8px;line-height:1.25;min-height:40px}
.card .kb{margin-top:8px;color:var(--soft);font-size:13px}
.stats{display:flex;gap:26px;font-size:24px;font-weight:700}
.stats small{display:block;font-size:14px;color:var(--soft);font-weight:500}
#mute{position:fixed;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(10,13,24,.6);color:var(--ink);font-size:18px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" title="Sound (M)">🔊</button>

<div id="menu" class="ov">
  <h1>SWARM</h1>
  <div class="sub">Survive 6 minutes.</div>
  <button id="go" class="big">Start</button>
  <div class="keys"><span><b>WASD</b> or <b>drag</b> to move</span><span>It shoots by itself</span></div>
</div>
<div id="cards" class="ov hide"></div>
<div id="pause" class="ov hide"><h2>Paused</h2><button id="resume" class="big">Go on</button></div>
<div id="end" class="ov hide"></div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2, STEP = 1 / 60, WIN_T = 360, CAP = 340, CS = 40;
const Q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');

let VW = 800, VH = 600, DPR = 1, Z = 1, SW = 800, SH = 600;
function resize() {
  SW = innerWidth || 1280; SH = innerHeight || 720;
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  Z = Math.max(.6, Math.min(1.15, Math.min(SW, SH) / 720));
  cv.width = Math.round(SW * DPR); cv.height = Math.round(SH * DPR);
  VW = SW / Z; VH = SH / Z;
}
addEventListener('resize', resize); resize();

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(Q.get('seed') ? +Q.get('seed') : (Math.random() * 1e9) | 0);
const rr = (a, b) => a + rnd() * (b - a);

/* ---------- sound (all made from oscillators, no files) ---------- */
let AC = null, muted = false, quiet = false, NB = null; const lastS = {};
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* no audio */ } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'sine', v = .06, slide = 0, delay = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, v = .08, freq = 1200) {
  const a = ac(); if (!a) return;
  if (!NB) { NB = a.createBuffer(1, a.sampleRate, a.sampleRate); const ch = NB.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = NB; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(v, a.currentTime); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + d);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(); s.stop(a.currentTime + d + .02);
}
const LIM = { shoot: 80, hit: 50, kill: 45, gem: 30, hurt: 200, nova: 150, zap: 90 };
function sfx(n, k = 0) {
  if (quiet || muted) return;
  const now = performance.now(); if (now - (lastS[n] || 0) < (LIM[n] || 0)) return; lastS[n] = now;
  switch (n) {
    case 'shoot': tone(640 + Math.random() * 90, .07, 'square', .02, -320); break;
    case 'hit': tone(210, .05, 'triangle', .04, -90); break;
    case 'kill': tone(150 + Math.random() * 40, .1, 'sawtooth', .035, -100); break;
    case 'gem': tone(660 + Math.min(k, 14) * 55, .09, 'sine', .04, 240); break;
    case 'heal': tone(520, .18, 'sine', .06, 400); break;
    case 'hurt': tone(110, .25, 'sawtooth', .09, -60); noise(.15, .09, 900); break;
    case 'nova': tone(90, .3, 'sine', .12, 220); noise(.25, .07, 500); break;
    case 'zap': noise(.09, .06, 5000); tone(900, .08, 'sawtooth', .02, -600); break;
    case 'level': [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, 'triangle', .07, 0, i * .07)); break;
    case 'boss': tone(70, .6, 'sawtooth', .12, -20); noise(.4, .09, 400); break;
    case 'die': tone(220, .8, 'sawtooth', .12, -190); noise(.6, .1, 700); break;
    case 'win': [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, .3, 'triangle', .08, 0, i * .11)); break;
    case 'pick': tone(880, .08, 'square', .04); break;
  }
}

/* ---------- data ---------- */
const TYPES = {
  drifter:  { r: 9,  hp: 3,   sp: 46, dmg: 8,  xp: 1,  col: '#ff5d73', shape: 'circle' },
  dasher:   { r: 8,  hp: 2.2, sp: 70, dmg: 7,  xp: 1,  col: '#ffb547', shape: 'tri' },
  brute:    { r: 17, hp: 22,  sp: 32, dmg: 16, xp: 6,  col: '#b06bff', shape: 'sq', kb: .12 },
  spitter:  { r: 10, hp: 6,   sp: 42, dmg: 6,  xp: 3,  col: '#4de2c5', shape: 'dia' },
  splitter: { r: 13, hp: 8,   sp: 44, dmg: 8,  xp: 2,  col: '#5fa8ff', shape: 'hex' },
  mini:     { r: 6,  hp: 1.6, sp: 78, dmg: 4,  xp: .5, col: '#5fa8ff', shape: 'hex' },
  boss:     { r: 40, hp: 520, sp: 40, dmg: 22, xp: 60, col: '#ff3d81', shape: 'star', kb: .02 }
};
const UP = {
  bolt:  { icon: '✦', name: 'Star Bolt', weapon: 1, d: ['Shoots the nearest foe', '2 bolts at once', 'Bolts pierce foes', '3 bolts at once', 'Faster. Pierces more'] },
  orbit: { icon: '🌀', name: 'Blades', weapon: 1, d: ['Blades circle you', '3 blades', 'Wider circle', '4 blades', '5 blades. Faster'] },
  nova:  { icon: '💫', name: 'Nova', weapon: 1, d: ['Pushes foes away', 'Bigger pulse', 'Pulses faster', 'Bigger pulse', 'Pulse hits hard'] },
  chain: { icon: '⚡', name: 'Lightning', weapon: 1, d: ['Zaps jump foe to foe', 'Jumps further', 'One more jump', 'Zaps faster', 'More jumps. Hits harder'] },
  speed: { icon: '👟', name: 'Swift', d: 'Move faster', max: 5 },
  magnet:{ icon: '🧲', name: 'Magnet', d: 'Pull gems from far', max: 5 },
  vital: { icon: '❤️', name: 'Vital', d: '+25 life and heal', max: 5 },
  might: { icon: '💥', name: 'Might', d: '20% more damage', max: 6 },
  haste: { icon: '🔥', name: 'Haste', d: 'Attack faster', max: 5 },
  regen: { icon: '🌿', name: 'Renew', d: 'Heal over time', max: 3 }
};
const WEAPON_MAX = 5;
const xpFor = l => Math.round(5 + l * 3.4 + l * l * .5);
const EVENTS = [
  { t: 40,  run: () => ring('drifter', 22) },
  { t: 90,  run: () => ring('dasher', 18) },
  { t: 150, run: () => spawnBoss('THE WARDEN') },
  { t: 200, run: () => ring('brute', 10) },
  { t: 250, run: () => ring('splitter', 16) },
  { t: 270, run: () => spawnBoss('THE WARDEN RETURNS') },
  { t: 320, run: () => ring('dasher', 30) }
];

/* ---------- state ---------- */
let G = null, AUTO = false;
function newGame(attract) {
  G = {
    attract: !!attract, t: 0, kills: 0, level: 1, xp: 0, xpNext: xpFor(1), over: false, won: false, endT: 0,
    choosing: null, pending: 0, paused: false, shake: 0, hurtFlash: 0, nid: 0, acc: 0, ev: 0, comboN: 0, comboT: 0,
    p: { x: 0, y: 0, vx: 0, vy: 0, r: 11, hp: 100, maxHp: 100, speed: 150, magnet: 70, dmg: 1, rate: 1, regen: 0, inv: 0, aim: 0 },
    lv: { bolt: 1, orbit: 0, nova: 0, chain: 0, speed: 0, magnet: 0, vital: 0, might: 0, haste: 0, regen: 0 },
    cd: { bolt: .3, nova: 2, chain: 1 }, oa: 0, blades: [],
    en: [], sh: [], eb: [], gem: [], heart: [], fx: [], txt: [], cam: { x: 0, y: 0 }, boss: null, banner: null
  };
  recalc();
}
function recalc() {
  const p = G.p, l = G.lv;
  p.speed = 150 * (1 + .1 * l.speed); p.magnet = 70 * (1 + .45 * l.magnet);
  p.maxHp = 100 + 25 * l.vital; p.dmg = 1 + .2 * l.might; p.rate = 1 + .15 * l.haste; p.regen = .7 * l.regen;
}
const swapRemove = (a, i) => { a[i] = a[a.length - 1]; a.pop(); };

/* ---------- input ---------- */
const keys = {}; let stick = null;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if (k === 'escape' || k === 'p') togglePause();
  if (k === 'm') setMute(!muted);
  if (G && G.choosing && '123'.includes(k) && k.length === 1) pickCard(+k - 1);
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; stick = null; if (G && !G.attract && !G.over && !G.choosing) setPause(true); });
cv.addEventListener('pointerdown', e => { ac(); stick = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY }; try { cv.setPointerCapture(e.pointerId); } catch (_) { /* ok */ } });
cv.addEventListener('pointermove', e => { if (stick && e.pointerId === stick.id) { stick.x = e.clientX; stick.y = e.clientY; } });
const endStick = e => { if (stick && e.pointerId === stick.id) stick = null; };
cv.addEventListener('pointerup', endStick); cv.addEventListener('pointercancel', endStick);
function inputVec() {
  let x = 0, y = 0;
  if (keys.a || keys.arrowleft) x -= 1; if (keys.d || keys.arrowright) x += 1;
  if (keys.w || keys.arrowup) y -= 1; if (keys.s || keys.arrowdown) y += 1;
  if (x || y) { const l = Math.hypot(x, y); return [x / l, y / l]; }
  if (stick) { const dx = stick.x - stick.ox, dy = stick.y - stick.oy, d = Math.hypot(dx, dy); if (d > 6) { const m = Math.min(1, d / 55); return [dx / d * m, dy / d * m]; } }
  return [0, 0];
}
function botVec() {
  const p = G.p; let ax = 0, ay = 0;
  for (const e of G.en) {
    const dx = p.x - e.x, dy = p.y - e.y, d2 = dx * dx + dy * dy, R = 150 + e.r;
    if (d2 < R * R) { const d = Math.sqrt(d2) || 1, w = (R - d) / R; ax += dx / d * w * w * 4; ay += dy / d * w * w * 4; }
  }
  for (const b of G.eb) {
    const dx = p.x - b.x, dy = p.y - b.y, d2 = dx * dx + dy * dy;
    if (d2 < 90 * 90) { const d = Math.sqrt(d2) || 1; ax += dx / d * 2; ay += dy / d * 2; }
  }
  let best = null, bd = 400 * 400;
  for (const g of G.gem) { const dx = g.x - p.x, dy = g.y - p.y, d2 = dx * dx + dy * dy; if (d2 < bd) { bd = d2; best = g; } }
  if (best) { const d = Math.sqrt(bd) || 1; ax += (best.x - p.x) / d * .7; ay += (best.y - p.y) / d * .7; }
  ax -= p.x * .0006; ay -= p.y * .0006;
  const l = Math.hypot(ax, ay); if (l < .05) return [0, 0];
  const m = Math.min(1, l); return [ax / l * m, ay / l * m];
}

/* ---------- spawning ---------- */
function spawn(type, x, y) {
  const T = TYPES[type], k = 1 + G.t / 110;
  const hp = type === 'boss' ? T.hp * (1 + G.t / 260) : T.hp * k;
  const e = { id: ++G.nid, type, x, y, r: T.r, hp, max: hp, fl: 0, ob: 0, kx: 0, ky: 0, tm: rnd() * 2, sh: 1 + rnd() * 2, dead: false, dx: 0, dy: 0, cc: 4, boost: 0 };
  G.en.push(e); return e;
}
function spawnRandom() {
  const t = G.t, w = [['drifter', 10 - Math.min(5, t / 60)]];
  if (t > 20) w.push(['dasher', 4 + t / 40]);
  if (t > 55) { w.push(['spitter', 3]); w.push(['splitter', 3]); }
  if (t > 85) w.push(['brute', 2 + t / 120]);
  let sum = 0; for (const [, x] of w) sum += x;
  let r = rnd() * sum, type = w[0][0];
  for (const [n, x] of w) { if ((r -= x) <= 0) { type = n; break; } }
  const a = rnd() * TAU, R = Math.hypot(VW, VH) / 2 + 40;
  spawn(type, G.p.x + Math.cos(a) * R, G.p.y + Math.sin(a) * R);
}
function ring(type, n) {
  const R = Math.hypot(VW, VH) / 2 + 60, a0 = rnd() * TAU;
  for (let i = 0; i < n; i++) { const a = a0 + i * TAU / n; spawn(type, G.p.x + Math.cos(a) * R, G.p.y + Math.sin(a) * R); }
  G.banner = { text: 'THEY SURROUND YOU', t: 2.2 };
}
function spawnBoss(name) {
  const a = rnd() * TAU, R = Math.hypot(VW, VH) / 2 + 80;
  G.boss = spawn('boss', G.p.x + Math.cos(a) * R, G.p.y + Math.sin(a) * R);
  G.banner = { text: name, t: 3 }; sfx('boss');
}

/* ---------- fx ---------- */
function burst(x, y, col, n, sp = 140, life = .5) {
  if (G.fx.length > 520) return;
  for (let i = 0; i < n; i++) { const a = rnd() * TAU, s = rr(.3, 1) * sp; G.fx.push({ k: 'p', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * rr(.6, 1), max: life, col, sz: rr(2, 4.5) }); }
}
function txt(x, y, s, col = '#fff') { if (G.txt.length < 45) G.txt.push({ x: x + rr(-6, 6), y, s, col, life: .7 }); }

/* ---------- combat ---------- */
function hurt(e, d, kx = 0, ky = 0) {
  if (e.dead) return;
  const T = TYPES[e.type], kb = T.kb === undefined ? 1 : T.kb;
  e.hp -= d; e.fl = .09; e.kx += kx * kb; e.ky += ky * kb;
  txt(e.x, e.y - e.r, Math.max(1, Math.round(d * 10)));
  if (e.hp <= 0) kill(e); else sfx('hit');
}
function kill(e) {
  e.dead = true; G.kills++;
  const T = TYPES[e.type];
  G.gem.push({ x: e.x, y: e.y, v: T.xp, mag: false, sp: 0 });
  if (rnd() < (e.type === 'brute' ? .18 : .018)) G.heart.push({ x: e.x + 8, y: e.y });
  burst(e.x, e.y, T.col, 6 + (e.r / 3 | 0), 150);
  if (e.type === 'splitter') for (let i = 0; i < 2; i++) { const m = spawn('mini', e.x + rr(-8, 8), e.y + rr(-8, 8)); m.kx = rr(-120, 120); m.ky = rr(-120, 120); }
  if (e.type === 'boss') {
    G.boss = null; G.shake = .7; burst(e.x, e.y, '#ff3d81', 60, 320, .9);
    for (let i = 0; i < 24; i++) G.gem.push({ x: e.x + rr(-50, 50), y: e.y + rr(-50, 50), v: 3, mag: false, sp: 0 });
    G.heart.push({ x: e.x, y: e.y });
  }
  sfx('kill');
}
function hurtPlayer(d) {
  const p = G.p; if (G.attract) { p.inv = .3; return; }
  p.hp -= d; p.inv = .55; G.shake = Math.max(G.shake, .28); G.hurtFlash = .3; sfx('hurt');
  burst(p.x, p.y, '#ff5d73', 10, 180);
  if (p.hp <= 0) { p.hp = 0; die(); }
}
function nearest(x, y, maxD, skip) {
  let b = null, bd = maxD * maxD;
  for (const e of G.en) { if (e.dead || (skip && skip.has(e))) continue; const dx = e.x - x, dy = e.y - y, d = dx * dx + dy * dy; if (d < bd) { bd = d; b = e; } }
  return b;
}

/* ---------- level up ---------- */
function checkLevel() {
  while (G.xp >= G.xpNext) { G.xp -= G.xpNext; G.level++; G.xpNext = xpFor(G.level); G.pending++; }
  if (G.pending && !G.choosing) openCards();
}
function cardPool() {
  const pool = [];
  for (const id in UP) {
    const u = UP[id], lv = G.lv[id], max = u.weapon ? WEAPON_MAX : u.max;
    if (lv >= max) continue;
    pool.push(id);
    if (u.weapon) pool.push(id);
  }
  return pool;
}
function openCards() {
  G.pending--;
  const pool = cardPool(), ch = [];
  while (ch.length < 3 && pool.length) { const id = pool[(rnd() * pool.length) | 0]; ch.push(id); for (let i = pool.length - 1; i >= 0; i--) if (pool[i] === id) pool.splice(i, 1); }
  if (!ch.length) { G.p.hp = G.p.maxHp; if (G.pending) openCards(); return; }
  G.choosing = ch; sfx('level');
  G.fx.push({ k: 'ring', x: G.p.x, y: G.p.y, r: 10, max: 260, t: 0, life: .6, col: '#ffc857' });
  if (G.attract || AUTO) { const w = ch.find(id => UP[id].weapon) || ch[0]; pickCard(ch.indexOf(w)); return; }
  const box = $('cards');
  box.innerHTML = '<h2>Level ' + G.level + '</h2><div class="row">' + ch.map((id, i) => {
    const u = UP[id], lv = G.lv[id];
    const tag = u.weapon ? (lv === 0 ? '<span class="tg">NEW</span>' : '<span class="tg up">Lv ' + (lv + 1) + '</span>') : '<span class="tg up">Lv ' + (lv + 1) + '</span>';
    const ds = u.weapon ? u.d[lv] : u.d;
    return '<button class="card" data-i="' + i + '"><div class="ic">' + u.icon + '</div><div class="nm">' + u.name + '</div>' + tag + '<div class="ds">' + ds + '</div><div class="kb">' + (i + 1) + '</div></button>';
  }).join('') + '</div>';
  box.classList.remove('hide');
  box.querySelectorAll('.card').forEach(b => b.addEventListener('click', () => pickCard(+b.dataset.i)));
}
function pickCard(i) {
  if (!G.choosing || !G.choosing[i]) return;
  const id = G.choosing[i]; G.lv[id]++;
  const oldMax = G.p.maxHp; recalc();
  if (id === 'vital') G.p.hp = Math.min(G.p.maxHp, G.p.hp + 25); else if (G.p.maxHp !== oldMax) G.p.hp = Math.min(G.p.maxHp, G.p.hp);
  G.choosing = null; $('cards').classList.add('hide'); sfx('pick');
  if (G.pending) openCards();
}

/* ---------- world step ---------- */
function weapons(dt) {
  const p = G.p, lv = G.lv;
  G.cd.bolt -= dt * p.rate;

  ctx.fillStyle = '#ffc857'; ctx.fillRect(0, 0, SW * Math.min(1, G.xp / G.xpNext), 10);
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'center';
  ctx.font = '800 34px "Baloo 2", system-ui'; ctx.fillStyle = '#fff7ea'; ctx.fillText(fmt(Math.min(WIN_T, G.t)), SW / 2, 50);
  ctx.font = '700 15px "Baloo 2", system-ui'; ctx.fillStyle = '#aab0cc'; ctx.fillText('Lv ' + G.level + '  ·  ' + G.kills + ' foes', SW / 2, 70);
  ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(14, 22, 170, 16);
  ctx.fillStyle = p.hp / p.maxHp < .3 ? '#ff5d73' : '#ff8a9b'; ctx.fillRect(14, 22, 170 * p.hp / p.maxHp, 16);
  ctx.font = '800 13px "Baloo 2", system-ui'; ctx.fillStyle = '#fff'; ctx.fillText(Math.ceil(p.hp) + ' / ' + p.maxHp, 20, 35);
  let x = 14; ctx.font = '22px system-ui'; ctx.textBaseline = 'middle';
  for (const id of ['bolt', 'orbit', 'nova', 'chain']) {
    const lv = G.lv[id]; if (!lv) continue;
    ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.fillText(UP[id].icon, x, 62);
    for (let i = 0; i < lv; i++) { ctx.fillStyle = '#ffc857'; ctx.fillRect(x + i * 6, 78, 4, 4); }
    x += 42;
  }
  if (G.boss) {
    const w = Math.min(420, SW - 40), bx = (SW - w) / 2;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(bx, SH - 40, w, 14); ctx.fillStyle = '#ff3d81'; ctx.fillRect(bx, SH - 40, w * Math.max(0, G.boss.hp / G.boss.max), 14);
  }
  if (G.banner) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = Math.min(1, G.banner.t * 1.5);
    ctx.font = '800 44px "Baloo 2", system-ui'; ctx.fillStyle = '#ff3d81'; ctx.fillText(G.banner.text, SW / 2, SH * .28); ctx.globalAlpha = 1;
  }
  if (stick) {
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy, d = Math.hypot(dx, dy), m = Math.min(d, 55);
    ctx.strokeStyle = 'rgba(255,247,234,.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 55, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(255,247,234,.45)'; ctx.beginPath(); ctx.arc(stick.ox + (d ? dx / d * m : 0), stick.oy + (d ? dy / d * m : 0), 20, 0, TAU); ctx.fill();
  }
}

/* ---------- loop ---------- */
let last = performance.now(), acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  acc += Math.min(.1, (ts - last) / 1000); last = ts;
  let n = 0; while (acc >= STEP && n++ < 5) { step(STEP); acc -= STEP; }
  if (n >= 5) acc = 0;
  render();
}
newGame(true);
requestAnimationFrame(frame);

/* test hooks: the page can be driven without frames (hidden tabs pause requestAnimationFrame) */
window.swarm = {
  get G() { return G; },
  start: startGame,
  setAuto(v) { AUTO = v; },
  sim(sec) { const was = quiet; quiet = true; const n = Math.round(sec / STEP); for (let i = 0; i < n; i++) step(STEP); quiet = was; },
  cards: () => G.choosing && G.choosing.slice(),
  levelUp() { G.xp = G.xpNext; checkLevel(); },
  kill() { G.p.hp = 1; hurtPlayer(50); },
  pick: pickCard
};
})();
</script>
